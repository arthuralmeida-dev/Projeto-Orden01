<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drop 21 — Loja</title>
    <!-- É ESSA LINHA AQUI QUE TRAZ A BELEZA DO PROJETO -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- CABEÇALHO NOVO ESTILO KABUM -->
<header class="topbar">
    <div class="shell" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

        <!-- 1. Logo (Esquerda) -->
        <a class="brand" href="loja.html">
            <span class="brand-type">DROP 21<small>URBAN SUPPLY</small></span>
        </a>

        <!-- 2. Barra de Pesquisa (Meio - Estilo Kabum) -->
        <div class="search-wrap" style="flex: 1; max-width: 600px; margin: 0 30px; display: flex; gap: 10px;">
            <input type="text" id="inputBusca" placeholder="Busque por nome do produto..." style="background: rgba(255,255,255,0.05);">
            <button class="button compact" onclick="buscarProdutos()">Pesquisar</button>
        </div>

        <!-- 3. Menu e Botão de Login (Direita) -->
        <nav class="nav-links" style="margin-left: 0;">
            <a class="nav-link" href="cadastro.html" style="color: var(--warning); display: flex; align-items: center; gap: 8px;">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                Entre ou Cadastre-se
            </a>
            <a class="nav-link" href="pdv.html">PDV</a>
            <a class="nav-link" href="client-web-listagem.html">Gestão</a>
        </nav>
    </div>
</header>

<main>
    <section class="hero">
        <div class="shell">
            <div class="hero-content">
                <p class="eyebrow">Edição limitada / 2026</p>
                <h1 class="display">O seu estilo.<br><em>Sem cópia.</em></h1>
                <p class="hero-copy">Sua próxima peça está aqui.</p>
            </div>
        </div>
        <!-- Logo de fundo sem bloquear a tela -->
        <div class="hero-drop" style="pointer-events: none;"><div class="drop-disc"></div><div class="drop-twentyone">2<span>1</span></div><div class="drop-slash"></div></div>
    </section>

    <section class="page-section" id="colecao">
        <div class="shell">
            <div class="section-head">
                <div><p class="eyebrow">Estoque em movimento</p><h2 class="section-title">A seleção<br>do momento.</h2></div>
            </div>

            <div class="shop-layout">
                <!-- VITRINE -->
                <div class="catalog-shell">
                    <div class="table-scroll">
                        <table id="vitrineTable">
                            <thead><tr><th>Produto</th><th>Preço</th><th>Estoque</th><th>Qtd.</th><th>Ação</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- CARRINHO -->
                <aside class="cart-panel">
                    <div class="panel-title"><h3>Sua sacola</h3></div>
                    <div class="table-scroll" style="max-height: 250px;">
                        <table id="carrinhoTable">
                            <thead><tr><th>Produto</th><th>Qtd</th><th>Preço</th><th>Subtotal</th><th></th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="cart-summary">
                        <div class="total-line"><span>Total</span><strong id="totalCarrinho">R$ 0.00</strong></div>
                        <div class="checkout-fields">
                            <div class="field"><label>Seu nome</label><input id="inputCliente" type="text" placeholder="Como podemos te chamar?"></div>
                            <div class="field"><label>Pagamento</label><select id="selectPagamentoLoja"><option value="PIX">PIX</option><option value="CARTAO">Cartão</option><option value="BOLETO">Boleto</option></select></div>
                        </div>
                        <button class="button" id="btnFinalizar" style="width: 100%;">Finalizar pedido</button>
                    </div>
                </aside>
            </div>
        </div>
    </section>
</main>

<script>
    // A "sacola" do cliente (começa vazia)
    let carrinho = [];

    function adicionarAoCarrinho(produtoId, nome, preco) {
        // 1. Pega a quantidade que o cliente digitou na caixinha
        const quantidade = parseInt(document.getElementById('qtd_' + produtoId).value);

        // 2. Coloca o produto dentro da sacola (carrinho)
        carrinho.push({
            produto: {id: produtoId},
            nome: nome,
            quantidade: quantidade,
            precoUnitario: preco,
            subTotal: quantidade * preco
        });

        // 3. Atualiza a tabela do carrinho na tela
        atualizarCarrinho();
        alert(nome + ' adicionado ao carrinho!');
    }

    function atualizarCarrinho() {
        const tableBody = document.getElementById('carrinhoTable').getElementsByTagName('tbody')[0];
        tableBody.innerHTML = ''; // Limpa a tabela antes de redesenhar
        let total = 0;

        carrinho.forEach((item, index) => {
            const row = tableBody.insertRow();
            row.insertCell(0).innerHTML = '<strong>' + item.nome + '</strong>';
            row.insertCell(1).textContent = item.quantidade;
            row.insertCell(2).textContent = item.precoUnitario;
            row.insertCell(3).textContent = item.subTotal.toFixed(2);

            // Botão de remover (com classe de estilo do design novo)
            const cellRemover = row.insertCell(4);
            cellRemover.innerHTML = '<button class="remove-link" onclick="removerDoCarrinho(' + index + ')">Remover</button>';

            total += item.subTotal;
        });

        document.getElementById('totalCarrinho').textContent = 'R$ ' + total.toFixed(2);
    }

    function removerDoCarrinho(index) {
        carrinho.splice(index, 1);  // Remove 1 item na posição "index"
        atualizarCarrinho();        // Redesenha a tabela
    }

    document.getElementById('btnFinalizar').addEventListener('click', function () {
        const nomeCliente = document.getElementById('inputCliente').value;
        if (!nomeCliente) { alert('Digite o nome do cliente!'); return; }
        if (carrinho.length === 0) { alert('O carrinho está vazio!'); return; }

        const pedidoJson = {
            nomeCliente: nomeCliente,
            formaPagamento: document.getElementById('selectPagamentoLoja').value,
            itens: carrinho
        };

        fetch('http://localhost:8080/pedidos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pedidoJson)
        })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao finalizar pedido');
                return response.json();
            })
            .then(data => {
                alert('Pedido realizado com sucesso! Número do pedido: ' + data.id);
                carrinho = [];
                atualizarCarrinho();
                document.getElementById('inputCliente').value = '';
                document.getElementById('vitrineTable').getElementsByTagName('tbody')[0].innerHTML = '';
                carregarProdutos();
            })
            .catch(error => alert('Erro: ' + error.message));
    });

    function carregarProdutos() {
        fetch('http://localhost:8080/produtos')
            .then(response => {
                if (!response.ok) throw new Error('Erro na rede: ' + response.status);
                return response.json();
            })
            .then(data => {
                const tableBody = document.getElementById('vitrineTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = '';
                data.forEach(produto => {
                    const row = tableBody.insertRow()
                    row.insertCell(0).innerHTML = '<span class="product-name">' + produto.nome + '</span>';
                    row.insertCell(1).innerHTML = '<span class="price">R$ ' + produto.preco + '</span>';
                    row.insertCell(2).innerHTML = '<span class="stock">' + produto.quantidade + ' un.</span>';

                    const cellQuantidade = row.insertCell(3);
                    cellQuantidade.innerHTML = '<input type="number" class="quantity-input" id="qtd_' + produto.id + '" value="1" min="1">';

                    const cellAcao = row.insertCell(4);
                    cellAcao.innerHTML = '<button class="button compact" onclick="adicionarAoCarrinho(' + produto.id + ', \'' + produto.nome + '\', ' + produto.preco + ')">Adicionar</button>';
                });
            })
            .catch(error => {
                console.error('Erro ao buscar produtos: ', error);
                alert('Opa! Não conseguimos carregar os produtos. O servidor está ligado?');
            });
    }

    function buscarProdutos() {
        const termo = document.getElementById('inputBusca').value;
        fetch('http://localhost:8080/produtos/buscar?nome=' + termo)
            .then(res => res.json())
            .then(data => {
                const tableBody = document.getElementById('vitrineTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = '';
                data.forEach(produto => {
                    const row = tableBody.insertRow();
                    row.insertCell(0).innerHTML = '<span class="product-name">' + produto.nome + '</span>';
                    row.insertCell(1).innerHTML = '<span class="price">R$ ' + produto.preco + '</span>';
                    row.insertCell(2).innerHTML = '<span class="stock">' + produto.quantidade + ' un.</span>';

                    const cellQuantidade = row.insertCell(3);
                    cellQuantidade.innerHTML = '<input type="number" class="quantity-input" id="qtd_' + produto.id + '" value="1" min="1">';

                    const cellAcao = row.insertCell(4);
                    cellAcao.innerHTML = '<button class="button compact" onclick="adicionarAoCarrinho(' + produto.id + ', \'' + produto.nome + '\', ' + produto.preco + ')">Adicionar</button>';
                });
            })
            .catch(error => alert('Erro na busca: ' + error.message));
    }

    document.addEventListener('DOMContentLoaded', carregarProdutos);
</script>
</body>
</html>
