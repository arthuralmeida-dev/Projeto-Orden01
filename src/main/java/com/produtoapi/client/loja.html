<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loja - 21 Drop</title>
</head>
<body>

<h2>Loja 21 Drop</h2>

<!-- PARTE 1: Vitrine de Produtos -->
<h3>Produtos Disponíveis</h3>

<label>Buscar Produto:</label>
<input type="text" id="inputBusca" placeholder="Digite o nome...">
<button onclick="buscarProdutos()">Pesquisar</button>
<br><br>

<table id="vitrineTable" border="1">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Estoque</th>
        <th>Quantidade</th>
        <th>Ação</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<br>

<!-- PARTE 2: Carrinho de Compras -->
<h3>Seu Carrinho</h3>
<table id="carrinhoTable" border="1">
    <thead>
    <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço Unit.</th>
        <th>Subtotal</th>
        <th>Ação</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>
<div id="totalCarrinho"><strong>Total: R$ 0.00</strong></div>

<br>

<label>Forma de Pagamento:</label>
<select id="selectPagamentoLoja">
    <option value="PIX">PIX</option>
    <option value="CARTAO">Cartão</option>
    <option value="BOLETO">Boleto</option>
</select>
<br><br>

<!-- PARTE 3: Finalizar Compra -->
<label>Nome do Cliente:</label>
<input type="text" id="inputCliente" required>
<button id="btnFinalizar">Finalizar Compra</button>

<!-- PARTE 4: Pedidos Realizados (COLE AQUI!) -->
<h3>Pedidos Realizados</h3>
<button onclick="carregarPedidos()">Atualizar Pedidos</button>
<table id="pedidosTable" border="1">
    <thead>
    <tr>
        <th>Nº Pedido</th>
        <th>Cliente</th>
        <th>Total</th>
        <th>Data</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
</table>


<script>
    // A "sacola" do cliente (começa vazia)
    let carrinho = [];

    function adicionarAoCarrinho(produtoId, nome, preco) {
        // 1. Pega a quantidade que o cliente digitou na caixinha
        const quantidade = parseInt(document.getElementById('qtd_' + produtoId).value);

        // 2. Coloca o produto dentro da sacola (carrinho)
        carrinho.push({
            produto: {id: produtoId},
            nome: nome,
            quantidade: quantidade,
            precoUnitario: preco,
            subTotal: quantidade * preco
        });

        // 3. Atualiza a tabela do carrinho na tela
        atualizarCarrinho();

        alert(nome + ' adicionado ao carrinho!');
    }


    function atualizarCarrinho() {
        const tableBody = document.getElementById('carrinhoTable').getElementsByTagName('tbody')[0];
        tableBody.innerHTML = ''; // Limpa a tabela antes de redesenhar
        let total = 0;

        carrinho.forEach((item, index) => { //index (posição do item na lista)
            const row = tableBody.insertRow();
            row.insertCell(0).textContent = item.nome;
            row.insertCell(1).textContent = item.quantidade;
            row.insertCell(2).textContent = item.precoUnitario;
            row.insertCell(3).textContent = item.subTotal.toFixed(2);

            // Botão de remover
            const cellRemover = row.insertCell(4);
            cellRemover.innerHTML = '<button onclick="removerDoCarrinho(' + index + ')">Remover</button>';

            total += item.subTotal;

        });

        document.getElementById('totalCarrinho').innerHTML = '<strong>Total: R$ ' + total.toFixed(2) + '</strong>';
    }

    function removerDoCarrinho(index) {
        carrinho.splice(index, 1);  // Remove 1 item na posição "index"
        atualizarCarrinho();        // Redesenha a tabela
    }

    document.getElementById('btnFinalizar').addEventListener('click', function () {
        // 1. Pega o nome do cliente
        const nomeCliente = document.getElementById('inputCliente').value;

        // 2. Verifica se o cliente digitou o nome
        if (!nomeCliente) {
            alert('Digite o nome do cliente!');
            return;
        }

        // 3. Verifica se o carrinho não está vazio
        if (carrinho.length === 0) {
            alert('O carrinho está vazio!');
            return;
        }

        // 4. Monta o JSON no formato que o PedidoRequest espera
        const pedidoJson = {
            nomeCliente: nomeCliente,
            formaPagamento: document.getElementById('selectPagamentoLoja').value,
            itens: carrinho
        };

        // 5. Manda pro Spring Boot!
        fetch('http://localhost:8080/pedidos', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(pedidoJson)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro ao finalizar pedido');
                }
                return response.json();
            })
            .then(data => {
                alert('Pedido realizado com sucesso! Número do pedido: ' + data.id);
                carrinho = [];
                atualizarCarrinho();
                document.getElementById('inputCliente').value = '';

                document.getElementById('vitrineTable').getElementsByTagName('tbody')[0].innerHTML = '';
                carregarProdutos();

            })
            .catch(error => {
                alert('Erro: ' + error.message);
            });
    });


    function carregarProdutos() {
        // Faz uma requisção GET para o endpoint de produtos
        fetch('http://localhost:8080/produtos')
            .then(response => { //O método .then() é usado para encadear ações
                if (!response.ok) {
                    // Lança um erro se a resposta não for ok
                    // Quando um erro é lançado, o fluxo de execução do código é interrompido ele salta para o bloco catch
                    throw new Error('Erro na rede: ' + response.status);
                }
                // Converte a resposta para JSON
                return response.json(); // Converte a resposta para JSON
            })
            .then(data => {
                // Obtém o corpo da tabela
                const tableBody = document.getElementById('vitrineTable').getElementsByTagName('tbody')[0];
                let totalProdutos = 0 // Inicializa o contador de produtos
                // Itera ssobre os dados recebidos e cria as linhas da tabela
                data.forEach(produto => {
                    const row = tableBody.insertRow()
                    const cellNome = row.insertCell(0);
                    const cellPreco = row.insertCell(1);
                    const cellEstoque = row.insertCell(2);
                    const cellQuantidade = row.insertCell(3);
                    const cellAcao = row.insertCell(4);

                    // Inserir os dados nas células
                    cellNome.textContent = produto.nome; // Insere o nome do produto na célula
                    cellPreco.textContent = produto.preco; // Insere o preço do produto na célula
                    cellEstoque.textContent = produto.quantidade; // Insere a quantidade do produto na célula

                    // Caixinha para o cliente escolher quantos quer
                    cellQuantidade.innerHTML = '<input type="number" id="qtd_' + produto.id + '" value="1" min="1">';
                    // Botão de adicionar ao carrinho
                    cellAcao.innerHTML = '<button onclick="adicionarAoCarrinho(' + produto.id + ', \'' + produto.nome + '\', ' + produto.preco + ')">Adicionar</button>';
                });
            })
            .catch(error => {
                console.error('Erro ao buscar produtos: ', error); // Exibe o erro no console
                alert('Opa! Não conseguimos carregar os produtos. O servidor está ligado?'); // Mostra um aviso pro cliente
            });
    }

    document.addEventListener('DOMContentLoaded', carregarProdutos);

    function carregarPedidos() {
        fetch('http://localhost:8080/pedidos')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('pedidosTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = '';
                data.forEach(pedido => {
                    const row = tableBody.insertRow();
                    row.insertCell(0).textContent = pedido.id;
                    row.insertCell(1).textContent = pedido.nomeCliente;
                    row.insertCell(2).textContent = 'R$ ' + pedido.valorTotal.toFixed(2);
                    row.insertCell(3).textContent = pedido.dataPedido;
                });
            })
            .catch(error => {
                alert('Erro ao carregar pedidos: ' + error.message);
            });
    }

    function buscarProdutos() {
        const termo = document.getElementById('inputBusca').value;

        fetch('http://localhost:8080/produtos/buscar?nome=' + termo)
            .then(res => res.json())
            .then(data => {
                const tableBody = document.getElementById('vitrineTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = ''; // Limpa a tabela

                data.forEach(produto => {
                    const row = tableBody.insertRow();
                    row.insertCell(0).textContent = produto.nome;
                    row.insertCell(1).textContent = produto.preco;
                    row.insertCell(2).textContent = produto.quantidade;

                    const cellQuantidade = row.insertCell(3);
                    cellQuantidade.innerHTML = '<input type="number" id="qtd_' + produto.id + '" value="1" min="1">';

                    const cellAcao = row.insertCell(4);
                    cellAcao.innerHTML = '<button onclick="adicionarAoCarrinho(' + produto.id + ', \'' + produto.nome + '\', ' + produto.preco + ')">Adicionar</button>';
                });
            })
            .catch(error => alert('Erro na busca: ' + error.message));
    }

</script>

</body>
</html>
