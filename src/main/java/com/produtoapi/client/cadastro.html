<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Drop 21</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
    <div class="shell" style="justify-content: center;">
        <a class="brand" href="index.html"><span class="brand-type" style="font-size: 20px;">DROP 21<small>URBAN SUPPLY</small></span></a>
    </div>
</header>

<main style="display: flex; justify-content: center; padding: 60px 20px;">
    <form class="form-card card" id="formCadastro" style="width: 100%; max-width: 450px; padding: 40px;">

        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="font-size: 26px; text-transform: uppercase; margin: 0;">Criar Conta</h2>
            <p style="color: var(--muted); font-size: 13px; margin-top: 5px;">Junte-se à Drop 21 e garanta suas peças.</p>
        </div>

        <div class="field"><label>Nome Completo</label><input type="text" id="inputNome" required></div>
        <div class="field"><label>E-mail</label><input type="email" id="inputEmail" required></div>
        <div class="field"><label>Senha</label><input type="password" id="inputSenha" required></div>

        <button class="button" type="submit" style="width: 100%; margin-top: 25px; height: 45px;">Finalizar Cadastro</button>

        <p style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted);">
            <!-- AQUI TAVA O ERRO! Agora aponta pro login.html certinho -->
            Já tem uma conta? <a href="login.html" style="color: var(--red); text-decoration: underline;">Entre aqui</a>
        </p>
    </form>
</main>

<script>

    // ---- Toast bonito no lugar do alert ----
    function mostrarToast(mensagem, tipo) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'toast ' + (tipo || 'info');
        toast.textContent = mensagem;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ---- Confirm bonito (substitui o confirm feio do navegador) ----
    function mostrarConfirm(mensagem) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <p>${mensagem}</p>
                    <div class="modal-botoes">
                        <button class="btn-confirmar" id="btnSim">Confirmar</button>
                        <button class="btn-cancelar-modal" id="btnNao">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            overlay.querySelector('#btnSim').onclick = () => { overlay.remove(); resolve(true); };
            overlay.querySelector('#btnNao').onclick = () => { overlay.remove(); resolve(false); };
        });
    }

    document.getElementById('formCadastro').addEventListener('submit', function(event) {
        event.preventDefault();

        const usuarioJson = {
            nome: document.getElementById('inputNome').value,
            email: document.getElementById('inputEmail').value,
            senha: document.getElementById('inputSenha').value,
            role: 'ROLE_CLIENTE'
        };

        fetch('https://drop21-backend.onrender.com/usuarios', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(usuarioJson)
        })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao criar conta');
                return response.json();
            })
            .then(data => {
                // Salva no navegador que o cliente logou!
                localStorage.setItem('usuarioLogado', JSON.stringify({ nome: data.nome, role: 'ROLE_CLIENTE' }));

                // Troca o formulário por uma mensagem de sucesso lindona
                const form = document.getElementById('formCadastro');
                form.innerHTML = `
                <div style="text-align: center; padding: 30px 0;">
                    <h2 style="color: var(--success); font-size: 28px; margin-bottom: 10px;">✔️ Conta Criada!</h2>
                    <p style="color: white; font-size: 16px;">Bem-vindo(a), <strong>${data.nome}</strong>.</p>
                    <p style="color: var(--warning); font-size: 13px; margin-top: 20px;">Redirecionando para a loja...</p>
                </div>
            `;
                // Espera 2 segundos e redireciona pra loja automaticamente
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            })
            .catch(error => {
                mostrarToast('Erro: ' + error.message);
            });
    });
</script>
</body>
</html>
