<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Drop 21</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
    <div class="shell" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <a class="brand" href="index.html"><span class="brand-type">DROP 21<small>URBAN SUPPLY</small></span></a>
        <nav class="nav-links" style="margin-left: 0;">
            <a class="nav-link" href="#" id="nomeUsuarioNav" style="color: var(--success);"></a>
            <a class="nav-link" href="index.html">Loja</a>
            <a class="nav-link is-current" href="meus-pedidos.html">Meus Pedidos</a>
        </nav>
    </div>
</header>

<main style="padding: 40px 20px;">
    <div class="shell" style="max-width: 900px; margin: 0 auto;">
        <h2 style="text-transform: uppercase; margin-bottom: 5px;">Meus Pedidos</h2>
        <p style="color: var(--muted); font-size: 13px; margin-bottom: 30px;">Acompanhe, pague ou cancele suas compras.</p>

        <div class="table-scroll">
            <table id="tabelaPedidos">
                <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Data</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Pagamento</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <p id="msgVazio" style="text-align: center; color: var(--muted); margin-top: 30px; display: none;">
            Você ainda não fez nenhum pedido.
        </p>
    </div>
</main>

<script>

    // ---- Toast bonito no lugar do alert ----
    function mostrarToast(mensagem, tipo) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'toast ' + (tipo || 'info');
        toast.textContent = mensagem;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ---- Confirm bonito (substitui o confirm feio do navegador) ----
    function mostrarConfirm(mensagem) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <p>${mensagem}</p>
                    <div class="modal-botoes">
                        <button class="btn-confirmar" id="btnSim">Confirmar</button>
                        <button class="btn-cancelar-modal" id="btnNao">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            overlay.querySelector('#btnSim').onclick = () => { overlay.remove(); resolve(true); };
            overlay.querySelector('#btnNao').onclick = () => { overlay.remove(); resolve(false); };
        });
    }

    // Verifica se está logado
    const logado = localStorage.getItem('usuarioLogado');
    if (!logado) {
        mostrarToast('Você precisa estar logado para ver seus pedidos!');
        window.location.href = 'login.html';
    }

    const usuario = JSON.parse(logado);
    document.getElementById('nomeUsuarioNav').textContent = '👤 Olá, ' + usuario.nome.split(' ')[0];

    //atualiza a tabela depois de pagar ou cancelar
    function carregarPedidos() {
        fetch('https://drop-21.onrender.com/pedidos/cliente?email=' + usuario.email)
            .then(response => {
                if (!response.ok) throw new Error('Erro ao buscar pedidos');
                return response.json();
            })
            .then(pedidos => {
                const tbody = document.getElementById('tabelaPedidos').getElementsByTagName('tbody')[0];
                tbody.innerHTML = '';

                if (pedidos.length === 0) {
                    document.getElementById('msgVazio').style.display = 'block';
                    return;
                }
                document.getElementById('msgVazio').style.display = 'none';

                pedidos.forEach(pedido => {
                    const row = tbody.insertRow();

                    row.insertCell(0).innerHTML = '<strong>#' + pedido.id + '</strong>';

                    let dataFormatada = '-';
                    if (pedido.dataPedido) {
                        dataFormatada = new Date(pedido.dataPedido).toLocaleString('pt-BR');
                    }
                    row.insertCell(1).textContent = dataFormatada;
                    row.insertCell(2).innerHTML = '<strong style="color: var(--success);">R$ ' + pedido.valorTotal.toFixed(2) + '</strong>';

                    // Status com cor diferente pra cada situação
                    const cellStatus = row.insertCell(3);
                    if (pedido.status === 'CANCELADO') {
                        cellStatus.innerHTML = '<span style="color: var(--red);">CANCELADO</span>';
                    } else if (pedido.status === 'PAGO') {
                        cellStatus.innerHTML = '<span style="color: var(--success);">PAGO ✓</span>';
                    } else {
                        cellStatus.innerHTML = '<span style="color: var(--warning);">PENDENTE</span>';
                    }

                    // Coluna de pagamento
                    const cellPagamento = row.insertCell(4);
                    if (pedido.status === 'PENDENTE') {
                        // Se ainda não pagou, mostra o select para escolher e pagar
                        cellPagamento.innerHTML = `
                            <select id="pgto_${pedido.id}" style="padding: 5px; background: #1a1a2e; color: white; border: 1px solid var(--line);">
                                <option style="background: #1a1a2e; color: white;" value="DINHEIRO">Dinheiro</option>
                                <option style="background: #1a1a2e; color: white;" value="PIX">PIX</option>
                                <option style="background: #1a1a2e; color: white;" value="CARTAO">Cartão</option>
                            </select>
                        `;
                    } else {
                        cellPagamento.textContent = pedido.formaPagamento || '-';
                    }

                    // Botões de ação
                    const cellAcao = row.insertCell(5);
                    if (pedido.status === 'PENDENTE') {
                        cellAcao.innerHTML = `
                            <div style="display: flex; gap: 6px;">
                                <button class="button compact" onclick="pagarPedido(${pedido.id})">Pagar</button>
                                <button class="button compact danger" onclick="cancelarPedido(${pedido.id})">Cancelar</button>
                            </div>
                        `;
                    } else {
                        cellAcao.textContent = '-';
                    }
                });
            })
            .catch(error => {
                console.error('Erro:', error);
                mostrarToast('Erro ao carregar seus pedidos.');
            });
    }

    async function pagarPedido(id) {
        const formaPagamento = document.getElementById('pgto_' + id).value;

        const ok = await mostrarConfirm('Confirmar pagamento do pedido #' + id + ' via ' + formaPagamento + '?');
        if (!ok) return;

        fetch('https://drop-21.onrender.com/pedidos/' + id + '/pagar', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ formaPagamento: formaPagamento })
        })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao registrar pagamento');
                mostrarToast('Pagamento do pedido #' + id + ' confirmado com sucesso! ✓', 'sucesso');
                carregarPedidos();
            })
            .catch(error => mostrarToast('Erro: ' + error.message, 'erro'));
    }

    async function cancelarPedido(id) {
        const ok = await mostrarConfirm('Tem certeza que deseja cancelar o pedido #' + id + '? Os produtos voltarão ao estoque.');
        if (!ok) return;

        fetch('https://drop-21.onrender.com/pedidos/' + id + '/cancelar', {
            method: 'PUT'
        })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao cancelar pedido');
                mostrarToast('Pedido #' + id + ' cancelado com sucesso!', 'info');
                carregarPedidos();
            })
            .catch(error => mostrarToast('Erro: ' + error.message, 'erro'));
    }

    document.addEventListener('DOMContentLoaded', carregarPedidos);
</script>
</body>
</html>
