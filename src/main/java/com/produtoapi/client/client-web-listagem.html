<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drop 21 — Gestão</title>
    <!-- O CSS puxado com o nome certinho! -->
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Enquanto não tiver a classe "autorizado", o body inteiro fica invisível.
           Isso impede qualquer conteúdo de aparecer antes da checagem. */
        html:not(.autorizado) body { display: none; }
    </style>

    <script>
        (function () {
            let usuario = null;
            try { usuario = JSON.parse(localStorage.getItem('usuarioLogado')); } catch (e) {}

            if (usuario && usuario.role === 'ROLE_DONO') {
                // libera a página: o body passa a aparecer
                document.documentElement.classList.add('autorizado');
            } else {
                // guarda o recado para a index.html mostrar
                sessionStorage.setItem('toastPendente', JSON.stringify({
                    mensagem: 'Acesso negado! Área exclusiva para a gerência.',
                    tipo: 'erro'
                }));
                // replace: o botão "voltar" do navegador NÃO volta pra cá
                location.replace('index.html');
            }
        })();
    </script>

</head>
<body>
<!-- Cabeçalho (Menu Superior) -->
<header class="topbar">
    <div class="shell" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <a class="brand" href="index.html">
            <span class="brand-type">DROP 21<small>URBAN SUPPLY</small></span>
        </a>

        <!-- Menu preparado para o Javascript preencher -->
        <nav class="nav-links" id="menuSuperior" style="margin-left: 0;"></nav>
    </div>
</header>

<main class="dashboard">
    <div class="shell">
        <!-- Banner do Dono -->
        <section class="dashboard-banner">
            <p class="eyebrow">Área restrita / Gestão</p>
            <h1>Controle com<br><em>atitude.</em></h1>
            <p>Gerencie seus produtos, estoque e resultados do dia aqui.</p>
        </section>

        <!-- Parte de cima: Cadastro e Tabela de Produtos -->
        <div class="dashboard-grid" style="margin-top: 30px;">

            <!-- Formulário de Produto -->
            <form class="form-card card" id="formProduto">
                <input type="hidden" id="inputIdProduto">
                <h2 style="margin-bottom: 20px;">Novo produto</h2>

                <div class="field">
                    <label>Nome do produto</label>
                    <input id="inputNome" type="text" required>
                </div>
                <div class="field">
                    <label>Quantidade em Estoque</label>
                    <input id="inputQuantidade" type="number" required>
                </div>
                <div class="field">
                    <label>Preço de Venda (R$)</label>
                    <input id="inputPreco" type="number" step="0.01" required>
                </div>
                <div class="field">
                    <label>Status</label>
                    <input id="inputStatus" type="text" value="Em estoque" required>
                </div>

                <button class="button" type="submit" style="width: 100%; margin-top: 15px;">Salvar produto</button>
            </form>

            <!-- Tabela de Produtos (Inventário) -->
            <section class="table-card">
                <div class="panel-title"><h2>Seu Inventário</h2></div>
                <div class="table-scroll">
                    <table id="produtosTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Preenchido pelo JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- Parte de baixo: Painel do Dia (Vendas) -->
        <section class="sales-grid" style="margin-top: 30px;">
            <!-- Pedidos da Loja Online -->
            <article class="sales-card table-card">
                <div class="panel-title"><h3>Pedidos da Loja Online</h3></div>
                <div class="table-scroll" style="max-height: 300px;">
                    <table id="tabelaPedidosOnline">
                        <thead><tr><th>ID</th><th>Cliente</th><th>Pgto</th><th>Total</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </article>

            <!-- Vendas do PDV -->
            <article class="sales-card table-card">
                <div class="panel-title"><h3>Vendas do Balcão (PDV)</h3></div>
                <div class="table-scroll" style="max-height: 300px;">
                    <table id="tabelaVendasBalcao">
                        <thead><tr><th>Caixa</th><th>Data / hora</th><th>Pgto</th><th>Total</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </article>
        </section>

        <!-- Botão para carregar as vendas -->
        <div style="display:flex;justify-content:center;margin-top:24px; margin-bottom: 50px;">
            <button class="button" type="button" onclick="carregarVendasDoDia()">Atualizar Painel de Vendas</button>
        </div>

    </div>
</main>

<script>

    // ---- Toast bonito no lugar do alert ----
    function mostrarToast(mensagem, tipo) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'toast ' + (tipo || 'info');
        toast.textContent = mensagem;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // ---- Confirm bonito (substitui o confirm feio do navegador) ----
    function mostrarConfirm(mensagem) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-box">
                    <p>${mensagem}</p>
                    <div class="modal-botoes">
                        <button class="btn-confirmar" id="btnSim">Confirmar</button>
                        <button class="btn-cancelar-modal" id="btnNao">Cancelar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            overlay.querySelector('#btnSim').onclick = () => { overlay.remove(); resolve(true); };
            overlay.querySelector('#btnNao').onclick = () => { overlay.remove(); resolve(false); };
        });
    }

    // ----------------------------------------------------
    // LÓGICA DE SEGURANÇA E MENU
    // ----------------------------------------------------
    function carregarMenu() {
        const userStr = localStorage.getItem('usuarioLogado');
        const nav = document.getElementById('menuSuperior');
        if (!nav) return;

        if (userStr) {
            const usuario = JSON.parse(userStr);



            nav.innerHTML = `
                <a class="nav-link" href="index.html">Loja</a>
                <a class="nav-link" href="pdv.html">PDV</a>
                <a class="nav-link is-current" href="client-web-listagem.html">Gestão</a>
                <a class="nav-link" href="#" style="color: var(--success); display: flex; align-items: center; gap: 5px; margin-left: 20px;">
                    👤 Olá, ${usuario.nome.split(' ')[0]}
                </a>
                <a href="#" onclick="sairDaConta()" style="color: var(--muted); font-size: 12px; margin-left: 10px; text-decoration: underline;">Sair</a>
            `;
        } else {
            window.location.href = 'login.html';
        }
    }

    function sairDaConta() {
        localStorage.removeItem('usuarioLogado');
        window.location.href = 'index.html';
    }

    // ----------------------------------------------------
    // O SEU CÓDIGO ORIGINAL DE PRODUTOS
    // ----------------------------------------------------
    function listarProdutos() {
        fetch('https://drop-21.onrender.com//produtos')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erro na rede: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                const tableBody = document.getElementById('produtosTable').getElementsByTagName('tbody')[0];
                tableBody.innerHTML = '';

                data.forEach(produto => {
                    const row = tableBody.insertRow()
                    row.insertCell(0).textContent = produto.id;
                    row.insertCell(1).innerHTML = '<strong style="color:white;">' + produto.nome + '</strong>';
                    row.insertCell(2).textContent = 'R$ ' + produto.preco;
                    row.insertCell(3).textContent = produto.quantidade + ' un.';
                    row.insertCell(4).textContent = produto.status;

                    const cellAcoes = row.insertCell(5);
                    cellAcoes.innerHTML = `
                    <div style="display:flex;gap:7px;">
                        <button class="button compact ghost" onclick="prepararEdicao(${produto.id}, '${produto.nome}', ${produto.quantidade}, ${produto.preco}, '${produto.status}')">Editar</button>
                        <button class="button compact danger" onclick="excluirProduto(${produto.id})">Excluir</button>
                    </div>`;
                });
            })
            .catch(error => console.error('Erro ao buscar produtos: ', error));
    }

    // Carrega tudo ao abrir a página
    document.addEventListener('DOMContentLoaded', function() {
        carregarMenu();
        listarProdutos();
        carregarVendasDoDia();
    });

    // Salvar ou Atualizar Produto
    document.getElementById('formProduto').addEventListener('submit', function(event) {
        event.preventDefault();

        const idV = document.getElementById('inputIdProduto').value;
        const produtoJson = {
            id: idV ? parseInt(idV) : null,
            nome: document.getElementById('inputNome').value,
            quantidade: document.getElementById('inputQuantidade').value,
            preco: document.getElementById('inputPreco').value,
            status: document.getElementById('inputStatus').value,
        };

        const url = idV ? 'https://drop-21.onrender.com//produtos/' + idV : 'https://drop-21.onrender.com//produtos';
        const method = idV ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(produtoJson)
        })
            .then(response => {
                if (!response.ok) throw new Error('Erro ao salvar produto');
                mostrarToast(idV ? 'Produto atualizado com sucesso!' : 'Produto criado com sucesso!');

                document.getElementById('formProduto').reset();
                document.getElementById('inputIdProduto').value = '';
                listarProdutos();
            })
            .catch(error => mostrarToast('Erro: ' + error.message));
    });

    function prepararEdicao(id, nome, qtd, preco, status) {
        document.getElementById('inputIdProduto').value = id;
        document.getElementById('inputNome').value = nome;
        document.getElementById('inputQuantidade').value = qtd;
        document.getElementById('inputPreco').value = preco;
        document.getElementById('inputStatus').value = status;
        document.getElementById('inputNome').focus();
    }

    function excluirProduto(id) {
        if (!confirm("Tem certeza que deseja excluir este produto? O botão não tem volta!")) return;
        fetch('https://drop-21.onrender.com//produtos/' + id, { method: 'DELETE' })
            .then(response => {
                if(!response.ok) throw new Error("Erro ao excluir. Ele pode estar num pedido.");
                mostrarToast("Excluído com sucesso!");
                listarProdutos();
            })
            .catch(error => mostrarToast(error.message));
    }

    // ----------------------------------------------------
    // PAINEL DE VENDAS
    // ----------------------------------------------------
    function carregarVendasDoDia() {
        // Pedidos da Loja Online
        fetch('https://drop-21.onrender.com//pedidos')
            .then(response => response.json())
            .then(pedidos => {
                const tbody = document.getElementById('tabelaPedidosOnline').getElementsByTagName('tbody')[0];
                tbody.innerHTML = '';
                pedidos.forEach(pedido => {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = '#' + pedido.id;
                    row.insertCell(1).textContent = pedido.nomeCliente || 'Visitante';
                    row.insertCell(2).textContent = pedido.formaPagamento || '-';
                    const total = pedido.valorTotal ? pedido.valorTotal.toFixed(2) : '0.00';
                    row.insertCell(3).innerHTML = `<strong style="color: var(--success);">R$ ${total}</strong>`;
                });
            })
            .catch(error => console.error('Erro ao carregar pedidos:', error));

        // Vendas do PDV (Balcão)
        fetch('https://drop-21.onrender.com//caixa/vendas')
            .then(response => response.json())
            .then(vendas => {
                const tbody = document.getElementById('tabelaVendasBalcao').getElementsByTagName('tbody')[0];
                tbody.innerHTML = '';
                vendas.forEach(venda => {
                    const row = tbody.insertRow();
                    const idCaixa = venda.caixa ? venda.caixa.id : (venda.caixaId || '1');
                    row.insertCell(0).textContent = 'Caixa #' + idCaixa;

                    let dataFormatada = 'Hoje';
                    if (venda.criadaEm) {
                        dataFormatada = new Date(venda.criadaEm).toLocaleString('pt-BR');
                    }
                    row.insertCell(1).textContent = dataFormatada;
                    row.insertCell(2).textContent = venda.formaPagamento || '-';
                    const total = venda.total ? venda.total.toFixed(2) : '0.00';
                    row.insertCell(3).innerHTML = `<strong style="color: var(--success);">R$ ${total}</strong>`;
                });
            })
            .catch(error => console.error('Erro ao carregar vendas do balcão:', error));
    }





</script>
</body>
</html>
